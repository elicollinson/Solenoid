manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: elicollinson/solenoid
    source: https://github.com/elicollinson/solenoid
    branch: main
    commit: "dc1d0936"
    scope: [app/__init__.py, app/agent/callbacks/memory.py, app/agent/chart_generator_agent/agent.py, app/agent/client/__init__.py,
      app/agent/code_executor_agent/__init__.py, app/agent/code_executor_agent/agent.py, app/agent/config.py, app/agent/local_execution/adk_wrapper.py,
      app/agent/mcp_agent/agent.py, app/agent/memory/adk_sqlite_memory.py, app/agent/memory/extractor.py, app/agent/memory/ingestion.py,
      app/agent/memory/memory_tools.py, app/agent/memory/search.py, app/agent/models/factory.py, app/agent/planning_agent/agent.py,
      app/agent/planning_agent/generic_executor.py, app/agent/prime_agent/agent.py, app/agent/prime_agent/user_proxy.py, app/agent/research_agent/agent.py,
      app/agent/search/universal_search.py, app/agent/search/web_retrieval.py, app/settings/validator.py, app/ui/agent_app.py,
      app/ui/chat_input/__init__.py, app/ui/message_list/__init__.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T17:01:41Z'
    url: https://a2as.org/certified/agents/elicollinson/solenoid
  signatures:
    digest: sha256:_BiBZObhOVJme7ia_GhcZi-vJOJayAktdG6qqMJ8LaA
    key: ed25519:K4E6HBs0j5DgQsMnCIGjEkz4WhwHeCDVS92NAn1ZWks
    sig: ed25519:K6TbCoFATI5JmqdrmT2pDINZHVAHwYh2cuPka8rfwTlT5FFUnj6XF-mkLR_BHFrKPZLTFYnjz-x955kAmt4dAw

agents:
  agent.0:
    type: instance
    models: [get_model]
    params:
      name: code_executor_agent
      instruction: CODE_EXECUTOR_PROMPT
      code_executor: secure_executor
      after_model_callback: [save_memories_on_final_response]
      disallow_transfer_to_peers: "True"
      disallow_transfer_to_parent: "True"
      instance: agent
  agent.1:
    type: instance
    models: [get_model]
    params:
      name: user_proxy_agent
      instruction: get_dynamic_instruction
      before_model_callback: [capture_user_query, inject_memories]
      after_model_callback: [save_memories_on_final_response]
      instance: agent
      sub_agents: [prime_agent]
  agent.2:
    type: instance
    models: [get_model]
    params:
      name: prime_agent
      instruction: PRIME_AGENT_PROMPT
      after_model_callback: [save_memories_on_final_response]
      instance: agent
      sub_agents: [planning_agent]
  agent.3:
    type: instance
    models: [get_model]
    params:
      name: generic_executor_agent
      instruction: GENERIC_EXECUTOR_PROMPT
      after_model_callback: [save_memories_on_final_response]
      disallow_transfer_to_peers: "True"
      disallow_transfer_to_parent: "True"
      instance: agent
  agent.4:
    type: instance
    models: [get_model]
    params:
      name: chart_generator_agent
      instruction: CHART_GENERATOR_PROMPT
      code_executor: secure_executor
      after_model_callback: [save_memories_on_final_response]
      disallow_transfer_to_peers: "True"
      disallow_transfer_to_parent: "True"
      instance: agent
  agent.5:
    type: instance
    models: [get_model]
    params:
      name: planning_agent
      instruction: get_dynamic_instruction
      after_model_callback: [save_memories_on_final_response]
      instance: agent
      sub_agents: [code_executor_agent, chart_generator_agent, research_agent, generic_executor_agent, mcp_agent]
  agent.6:
    type: instance
    models: [get_model]
    tools: [search_tool, read_webpage_tool]
    params:
      name: research_agent
      instruction: RESEARCH_AGENT_PROMPT
      after_model_callback: [save_memories_on_final_response]
      disallow_transfer_to_peers: "True"
      disallow_transfer_to_parent: "True"
      instance: agent
  agent.ADKClient.agent:
    type: class
    models: [get_granite_model]
    params:
      name: helper
      instruction: instruction
      class: ADKClient
  mcp_agent:
    type: instance
    models: [get_model]
    tools: [_mcp_toolsets]
    params:
      name: mcp_agent
      instruction: MCP_AGENT_PROMPT
      disallow_transfer_to_peers: "True"
      disallow_transfer_to_parent: "True"
      before_model_callback: log_tools_before_model
      after_model_callback: [save_memories_on_final_response]
  memory_agent:
    type: instance
    models: [gemma2-2b-it]
    tools: [StoreMemoryTool, RetrieveMemoryTool, load_memory]
    params:
      name: MemoryAgent
      instruction: [You manage the user's long-term memory. Use store_memory to persist facts and retrieve_memory to answer
          questions about prior preferences or episodes.]

models:
  gemma2-2b-it:
    type: literal
    agents: [memory_agent]
  get_granite_model:
    type: function
    agents: [agent.ADKClient.agent]
    params:
      wrapper: get_granite_model
  get_model:
    type: function
    agents: [mcp_agent, agent.0, agent.1, agent.2, agent.3, agent.4, agent.5, agent.6]
    params:
      wrapper: get_model
      arg_0: mcp_agent

tools:
  _mcp_toolsets:
    type: function
    agents: [mcp_agent]
    params:
      dynamic: "True"
  load_memory:
    type: function
    agents: [memory_agent]
  read_webpage_tool:
    type: function
    agents: [agent.6]
  RetrieveMemoryTool:
    type: function
    agents: [memory_agent]
  search_tool:
    type: function
    agents: [agent.6]
  StoreMemoryTool:
    type: function
    agents: [memory_agent]

mcp:
  command:
    type: process
    params:
      class: McpToolset
      connection_type: StdioConnectionParams
      command: command
      args: resolved_args
      function: load_mcp_toolsets_from_settings
  McpToolset:
    type: network
    url: http://{...}:{...}/api/pull
    params:
      class: McpToolset
      connection_type: StreamableHTTPConnectionParams
      headers: headers
      function: load_mcp_toolsets_from_settings

teams:
  agent.1:
    type: hierarchy
    agents: [agent.1, prime_agent]
  agent.2:
    type: hierarchy
    agents: [agent.2, planning_agent]
  agent.5:
    type: hierarchy
    agents: [agent.5, code_executor_agent, chart_generator_agent, research_agent, generic_executor_agent, mcp_agent]

