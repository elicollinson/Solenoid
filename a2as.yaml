variables:
  BRAVE_SEARCH_API_KEY:
    type: env
    params:
      caller: [os.environ.get]
      path: [app.agent.search.universal_search]

files:
  ../../:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../../]
  ../../../:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [_CURRENT_DIR, ../../../]
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: ['*']
      caller: [run]
  .ollama_bin:
    type: literal
    actions: [read]
    params:
      path: [_PROJECT_ROOT]
  _BUNDLED_OLLAMA_DIR:
    type: variable
    actions: [write]
    params:
      caller: [_BUNDLED_OLLAMA_DIR.mkdir]
  absolute_config_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open, yaml.safe_load]
  absolute_settings_path:
    type: variable
    actions: [read]
    params:
      caller: [open, yaml.safe_load]
      alias: [f]
  APP_LOG_DIR:
    type: variable
    actions: [write]
    params:
      caller: [APP_LOG_DIR.mkdir]
  APP_LOG_FILE:
    type: variable
    actions: [read]
    params:
      caller: [APP_LOG_FILE.read_text]
  app_settings.yaml:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [project_root, app_settings.yaml]
  backup_path:
    type: variable
    actions: [write, read]
    params:
      caller: [open, os.path.exists]
      alias: [f]
  config_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open, yaml.safe_load, os.path.join]
  db_path:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  DEFAULT_DB_PATH:
    type: literal
    actions: [read]
    params:
      caller: [Path(memories.db)]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [file_path.read_text, file_path.read_bytes]
  HOME_SETTINGS_PATH:
    type: variable
    actions: [write]
    params:
      caller: [HOME_SETTINGS_PATH.write_text]
  log_file:
    type: variable
    actions: [read]
    params:
      caller: [open]
  path:
    type: variable
    actions: [read, write]
    params:
      caller: [open, yaml.safe_load, path.write_bytes]
      alias: [f]
  SCHEMA_PATH:
    type: literal
    actions: [read]
    params:
      caller: [Path.with_name(schema.sql)]
  script_path:
    type: variable
    actions: [read]
    params:
      caller: [script_path.read_text]
  settings_path:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [_PROJECT_ROOT, settings_path]
  solenoid.log:
    type: literal
    actions: [read]
    params:
      path: [APP_LOG_DIR]
  stderr.txt:
    type: literal
    actions: [read]
    params:
      caller: [run]
      path: [temp_dir]
  stderr_path:
    type: variable
    actions: [write, read]
    params:
      caller: [open, stderr_path.read_text]
      alias: [f]
  stdout.txt:
    type: literal
    actions: [read]
    params:
      caller: [run]
      path: [temp_dir]
  stdout_path:
    type: variable
    actions: [read]
    params:
      caller: [stdout_path.read_text]
  temp_dir:
    type: literal
    actions: [read, write, delete]
    params:
      caller: ['Path(''temp_sandbox_{run_id}'')', temp_dir.mkdir, temp_dir.rglob, shutil.rmtree]
  wasm_path:
    type: variable
    actions: [read]
    params:
      caller: [Path]

networks:
  api.search.brave.com:
    type: api
    actions: [GET, POST]
    urls: [/res/v1/web/search]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [universal_search, _is_ollama_up, _check_model_exists, _pull_model, read_webpage]
  app:
    type: api
    actions: [GET]
    protocols: [http]
    ports: ["80"]
    params:
      caller: [main]
      pattern: http://{BACKEND_HOST}:{BACKEND_PORT}
  toolset:
    type: api
    actions: [GET]
    protocols: [http]
    ports: ["80"]
    params:
      caller: [load_mcp_toolsets_from_settings]
      pattern: http://{...}:{...}/api/pull
  url:
    type: api
    actions: [GET]
    protocols: [http]
    ports: ["80"]
    params:
      pattern: http://{host}:{port}/api/tags
      caller: [_is_ollama_up, _check_model_exists]
      dynamic: "True"
      variable: url
  url.1:
    type: api
    actions: [GET]
    protocols: [http]
    ports: ["80"]
    params:
      pattern: http://{host}:{port}/api/pull
      caller: [_pull_model]
      dynamic: "True"
      variable: url
  url.2:
    type: api
    actions: [GET]
    protocols: [http]
    ports: ["80"]
    params:
      pattern: http://{OLLAMA_HOST}:{OLLAMA_PORT}/api/pull
      caller: [pull_model_with_progress]
      dynamic: "True"
      variable: url
